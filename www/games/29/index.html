<script>

const rk=c=>RK.indexOf(c.r),pt=c=>PT[c.r]||0,tm=s=>s%2,red=c=>c.s=='♥'||c.s=='♦';

function info(){
 $('i1').textContent=bidder>=0?`${NM[bidder]} - ${target}${shown&&trump?' '+trump:''}${type=='Joker'?' · Joker':''}`:'–';
 $('tcard').classList.toggle('glow',askable&&!shown);
 {const tc=$('tcard'),face=!!type&&type!='Joker'&&bidder>=0&&shown&&trump;
  tc.classList.toggle('face',face);tc.textContent=face?'':(type=='Joker'&&bidder>=0?'No trump':'Trump');

    const showC = trumpCard || {r:'A',s:trump};

  }}

 $('i3').innerHTML=`Our Point: ${pts[0]}<br>Their Point: ${pts[1]}`;

 // Score display matching screenshots:
 // 0 points → only card back
 // positive → red 6♥ face under + back on top (rotated)
 // negative → black 6♣ face under + back on top (rotated)
 const we = g[0], they = g[1];
 const weR = Math.max(0, we), weB = Math.max(0, -we);
 const thR = Math.max(0, they), thB = Math.max(0, -they);

 const setPile = (prefix, redCount, blackCount) => {
   const base = $(prefix+'Base');
   const red = $(prefix+'RedCard');
   const black = $(prefix+'BlackCard');
   const over = $(prefix+'BackOver');
   if(!base||!red||!black||!over) return;

   // reset

   if(redCount > 0){
     // show red 6 under + back over

   } else if(blackCount > 0){

     over.className = 'sc back backOver';
     if(blackCount >= 5){ black.style.outline='2px solid #e74c3c'; black.style.outlineOffset='2px'; }

   } else {
     // 0 points → only back

   }
 };
 setPile('we', weR, weB);
 setPile('they', thR, thB);
}function renderHand(lg,cb){const h=$('hand');h.innerHTML='';H[0].forEach(c=>{const e=mk(c);if(lg){if(lg.includes(c)){e.classList.add('ok');e.onclick=()=>cb(c)}else e.classList.add('no')}h.appendChild(e)})}

 const rem=29-pts[0]-pts[1],adj=(marr||type=='Joker')?0:4;
 return pts[bt]>=target+adj||pts[bt]+rem<target-adj}
async function playTrick(lead,isLast){trick=[];$('trick').innerHTML='';
 const W=ms=>skipping?Promise.resolve():sleep(ms);
 for(let i=0;i<4;i++){const s=(lead+i)%4;if(single&&s==(bidder+2)%4)continue;turn(s);
  if(s==bidder&&!shown&&trumpCard&&!H[s].length)await revealTrump(s);
  const h=H[s];let lg=h;const led=trick.length?trick[0].c.s:null;const f=led?h.filter(x=>x.s==led):[];
  if(f.length)lg=f;
  let mustAsk=!!led&&!f.length&&!shown&&type!='Joker';
  const mustTrump=()=>{const t=h.filter(x=>x.s==trump);return t.length?t:h};
  let c;
  if(s==0&&!skipping){
   for(;;){
    askable=mustAsk;info();
    $('yt').textContent=mustAsk?'No '+led+' in hand - tap Trump to ask':'Your Turn';$('yt').classList.add('on');
    const r=await new Promise(res=>{askFn=()=>res('ask');skipFn=()=>res('skip');renderHand(mustAsk?[]:lg,res)});
    askable=false;askFn=null;skipFn=null;
    if(r==='ask'){await revealTrump(0);mustAsk=false;lg=mustTrump();continue}
    if(r==='skip'){if(mustAsk){await revealTrump(0);mustAsk=false;lg=mustTrump()}c=bot(0,lg);break}
    c=r;break}
   $('yt').classList.remove('on');info()}
  else{
   if(s!=0)await W(750);
   if(mustAsk){await revealTrump(s);lg=mustTrump()}
   c=bot(s,lg)}
  H[s]=h.filter(x=>x!==c);if(s==0)renderHand();
  if(shown&&trump&&c.s==trump&&!marr&&tw[tm(s)]>0&&(c.r=='K'||c.r=='Q')&&H[s].some(x=>x.s==trump&&x.r==(c.r=='K'?'Q':'K'))){marr=true;const mine=tm(s)==tm(bidder);target+=mine?-4:4;info();snd(990,.2);if(!skipping)await modal(`<h2>${NM[s]} ${s==0?'have':'has'} Marriage</h2><div style="font-size:34px;margin-bottom:8px">🤴👸</div><p>Target ${mine?'reduced':'raised'} to ${target}</p><button class="btn pri" data-v="1">OK</button>`)}
  trick.push({s,c});const e=mk(c);e.className+=' tc t'+s;$('trick').appendChild(e);if(!skipping)snd(440,.05)}
 const w=winnerOf(trick),wt=tm(w.s);pts[wt]+=trick.reduce((a,x)=>a+pt(x.c),0)+(isLast?1:0);tw[wt]++;lastT=[...trick];info();
 say(w.s,isLast?'Last trick +1':'Takes it');await W(800);
 const D=[[0,170],[-140,0],[0,-170],[140,0]][w.s];document.querySelectorAll('#trick .tc').forEach(e=>{e.style.transition='transform .45s ease-in,opacity .45s';e.style.transform=`translate(${D[0]}px,${D[1]}px) scale(.6)`;e.style.opacity=0});await W(480);return w.s}
async function round(){
 const d=rn%4,order=[1,2,3,4].map(i=>(d+i)%4),dk=[];
 for(const s of SU)for(const r of RK)dk.push({s,r});
 for(let i=31;i>0;i--){const j=Math.random()*(i+1)|0;[dk[i],dk[j]]=[dk[j],dk[i]]}
 H=[0,1,2,3].map(i=>dk.slice(i*4,i*4+4));const rest=[0,1,2,3].map(i=>dk.slice(16+i*4,20+i*4));
 trump=null;shown=false;type='';askable=false;bid=15;bidder=-1;pts=[0,0];trick=[];marr=false;tw=[0,0];skipping=false;$('skip').style.display='none';$('yt').classList.remove('on');
 H.forEach(sortH);seats();$('trick').innerHTML='';renderHand();info();
 for(const s of order){turn(s);let b;if(s==0)b=await humanBid();else{await sleep(650);b=botBid(s)}
  if(b){bid=b;bidder=s;target=b;say(s,'Bid '+b)}else say(s,'Pass');snd(b?660:330);info()}
 if(bidder<0){await modal('<h2>Everyone passed</h2><p>New deal</p><button class="btn pri" data-v="1">Deal again</button>');rn++;return}
 target=bid;turn(bidder);single=false;mult=1;trumpCard=null;lastT=null;
 for(;;){
  const k=bidder==0?await humanPick():(Math.random()<.12?'Joker':Math.random()<.3?'7th':botTrump(bidder));
  // Joker = no trump
  if(k=='Joker'){type='Joker';trump=null;trumpCard=null;shown=true;break}
  // Normal suit (Hand): only set the suit. Do NOT remove any card. Do NOT touch 7th card.
  if(k!='7th'){
    type='Hand';
    trump=k;
    trumpCard=null;
    break;
  }
  // Only when player chooses "7th Card": hold out the 7th card
  type='7th';
  const c=rest[bidder].splice(2,1)[0];
  trumpCard=c;
  trump=c.s;
  if(bidder!=0)break;
  H[0]=H[0].concat(rest[0].splice(0));sortH(H[0]);renderHand();
  const inh=H[0].concat(rest[0]).some(x=>x.s==c.s&&pt(x)>0);
  const sn={'♠':'Spade','♥':'Heart','♦':'Diamond','♣':'Club'}[c.s];
  const p=modal(`<div class="row" style="align-items:center;margin-bottom:14px"><div style="font-size:16px;line-height:1.5;text-align:left">7th card is<br><b>${c.r} of ${sn}</b><br>You have ${inh?'':'no '}point of Trump in hand</div><div id="tcs"></div></div>${inh?'<button class="btn pri" data-v="1">OK</button>':'<div class="row"><button class="btn" data-v="1">Play</button><button class="btn" data-v="0">Reset</button></div>'}`);
  $('tcs').appendChild(mk(c));
  if(await p=='1')break;
  $('hand').innerHTML='';toast('Dealing again…');await sleep(700);return;
 }
 info();
 await modal(`<h2>${NM[bidder]} set trump</h2><p>Target Point: ${target}<br>Trump Type: ${type}${bidder==0&&trump?'<br>Trump: '+SN[trump]:''}</p><button class="btn pri" data-v="1">OK</button>`);
 single=bidder==0?(await modal('<h2>Do you want to play Single Hand?</h2><div class="row"><button class="btn" data-v="1">Yes</button><button class="btn" data-v="0">No</button></div>'))=='1':(target>=22&&H[bidder].concat(rest[bidder]).filter(x=>x.r=='J'||x.r=='9').length>=4&&Math.random()<.5);
 if(single&&bidder)await modal(`<h2>${NM[bidder]} plays Single Hand</h2><button class="btn pri" data-v="1">OK</button>`);
 let dbl=-1,rd=-1;
 for(const s of [1,3].map(k=>(bidder+k)%4)){
  if(s==0){if(await modal(`<h2>Double?</h2><p>${NM[bidder]} bid ${target} · ${type}</p><div class="row"><button class="btn" data-v="1">Double</button><button class="btn" data-v="0">No</button></div>`)=='1'){dbl=0;break}}
  else{await sleep(450);if(target>=18&&Math.random()<.12){dbl=s;break}}}
 if(dbl>=0){
  say(dbl,'Double');snd(700,.12);await sleep(700);
  for(const s of single?[bidder]:[bidder,(bidder+2)%4]){
   if(s==0){if(await modal(`<h2>${dbl==0?'You':NM[dbl]} doubled</h2><p>Re-Double?</p><div class="row"><button class="btn" data-v="1">Re-Double</button><button class="btn" data-v="0">No</button></div>`)=='1'){rd=0;break}}
   else{await sleep(450);if(Math.random()<.25){rd=s;break}}}
  if(rd>=0){say(rd,'Re-Double');snd(800,.12);await sleep(700)}}
 mult=(single?3:1)*(dbl>=0?2:1)*(rd>=0?2:1);info();
 H.forEach((h,i)=>{h.push(...rest[i]);sortH(h)});renderHand();await sleep(500);
 let lead=order[0];for(let k=0;k<8;k++){lead=await playTrick(lead,k==7);$('skip').style.display=(!skipping&&k<7&&decided())?'block':'none'}
 skipping=false;$('skip').style.display='none';
 const bt=tm(bidder),won=single?tw[bt]==8:pts[bt]>=target;g[bt]+=(won?1:-1)*mult;info();
 const lbl=won?(bt==0?'Your team wins':'Mia and Zoe win'):(bt==0?'Your team falls short':'Bid defeated');
 const gpTxt = (won?'+':'-') + mult + (won ? ' Red' : ' Black');
 await modal(`<h2>${lbl}</h2><p>${single?`${NM[bidder]} played Single Hand and took ${tw[bt]} of 8 tricks.`:`${NM[bidder]} bid ${target}. Bidding team scored ${pts[bt]} of 29.`} <br>Game mark: ${gpTxt}</p><button class="btn pri" data-v="1">New Deal</button>`);
 const W=(g[0]>=WIN||g[1]<=-WIN)?0:(g[1]>=WIN||g[0]<=-WIN)?1:-1;
 if(W>=0){
  const winTxt = W===0 ? 'You (We) win the match!' : 'Mia & Zoe (They) win the match!';
  const how = W===0 
    ? (g[0]>=WIN ? 'You reached 6 Red' : 'They reached 6 Black')
    : (g[1]>=WIN ? 'They reached 6 Red' : 'You reached 6 Black');
  await modal(`<h2>${winTxt}</h2><p>${how}<br>Final: We ${g[0]} · They ${g[1]}</p><button class="btn pri" data-v="1">New Match</button>`);
  g=[0,0];
 }
 rn++}

 if(askable&&askFn){askFn();return}
 if(!shown){toast(bidder==0?'Trump can be seen only when you cannot follow suit':'Trump stays hidden until someone cannot follow suit');return}
 if(type=='Joker'){toast('Joker hand: no trump');return}
 modal(`<h2>Trump card</h2><p>Trump is ${SN[trump]}</p><div class="row" id="tcs"></div><button class="btn pri" data-v="1">OK</button>`);$('tcs').appendChild(mk(trumpCard||{r:'',s:trump}))};
(async()=>{await modal('<h2>29</h2><p>You and Leo against Mia and Zoe</p><button class="btn pri" data-v="1">New Deal</button>');for(;;)await round()})();
