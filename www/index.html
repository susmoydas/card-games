<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Card Games</title><link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;--ink:#f7f7fb;--mute:#b9b9c9;--red:#ff4d5a;--acc:#ffcf4a;--glass:rgba(18,18,24,.72);--gb:rgba(255,255,255,.16);--hi:0 10px 30px #0009,inset 0 1px 0 rgba(255,255,255,.08);--w:clamp(52px,14vw,78px);--hw:clamp(60px,16vw,90px);--ease:cubic-bezier(.2,.8,.2,1);--line:rgba(255,255,255,.24)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#000;color:var(--ink);font:500 15px/1.4 'Lexend',system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
#app{min-height:100dvh;display:flex;flex-direction:column;max-width:460px;margin:0 auto}
/* ===== COPY: shared glass surface + glass button (use for EVERY popup) ===== */
.glass{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,0) 40%),var(--glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:#1c202b}}
.gbtn{min-height:44px;padding:12px 18px;border-radius:16px;border:1px solid var(--line);color:#fff;font:600 15px/1.25 inherit;background:rgba(255,255,255,.12);white-space:normal;overflow-wrap:anywhere;text-align:center;cursor:pointer;transition:transform .12s var(--ease),background .12s;-webkit-tap-highlight-color:transparent}
.gbtn:active{transform:scale(.97);background:rgba(255,255,255,.22)}
.gbtn:focus-visible{outline:2px solid #7dd3fc;outline-offset:2px}
.gbtn.primary{background:linear-gradient(180deg,rgba(94,234,160,.55),rgba(34,150,98,.55));border-color:rgba(160,255,210,.55)}
@font-face{font-family:Lexend;font-weight:400;font-display:swap;src:url(fonts/lexend-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Lexend;font-weight:500;font-display:swap;src:url(fonts/lexend-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Lexend;font-weight:600;font-display:swap;src:url(fonts/lexend-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Lexend;font-weight:700;font-display:swap;src:url(fonts/lexend-latin-700-normal.woff2) format("woff2")}
:root{--ink:#f4f4f7;--mute:#9a9aa8;--acc:#ffcf4a;--red:#f04444;--glass:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));--gb:rgba(255,255,255,.16);--hi:inset 0 1px 0 rgba(255,255,255,.28);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0 auto;height:100%;max-width:480px;background:#000;color:var(--ink);font-family:Lexend,Satoshi,-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none;padding:0}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.gc,.gl,.ic,.sheet{background:var(--glass);border:1px solid var(--gb);box-shadow:var(--hi);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6)}
/* home */
#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 18px 60px}
h1{font-size:30px;letter-spacing:-.02em;margin:0 0 6px;font-weight:700}
#home p{margin:0 0 22px;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px}
.gc{position:relative;aspect-ratio:1/1.15;border-radius:24px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 32%,#16161c),#0c0c10);transition:transform .15s}
.gc:active{transform:scale(.96)}
.gc i{position:absolute;top:12px;left:16px;font-style:normal;font-size:62px;line-height:1;color:var(--c)}
.gc b{font-size:19px}.gc small{color:var(--mute);font-size:11.5px;margin-top:2px}
.gc:not(.lock)::after{content:"Play";position:absolute;top:16px;right:14px;background:var(--acc);color:#000;font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px}
.gc.lock{opacity:.65}.gc u{position:absolute;top:14px;right:14px;text-decoration:none;font-size:11px;background:rgba(255,255,255,.12);color:var(--mute);padding:4px 10px;border-radius:99px}
/* 29 standalone game (isolated page) */
#g29{position:fixed;inset:0;z-index:100;display:flex;justify-content:center;background:#0c0d12}
#g29 iframe{display:block;width:100%;max-width:480px;height:100%;border:0;background:#0c0d12}
/* game shell */
#game{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px 10px max(10px,env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:10px}header b{flex:1;font-size:17px}
.ic{width:44px;height:44px;border-radius:50%;font-size:20px;display:grid;place-items:center}
header .ic img{width:22px;height:22px}
#top{display:flex;gap:6px;padding:6px 0 2px;align-items:flex-start}
.side-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.gl{flex:1;min-width:0;border-radius:16px;padding:7px 9px}
.side-col .gl{flex:none}
.gl h4{margin:0 0 2px;font-size:12px;font-weight:500;color:var(--mute);display:flex;justify-content:space-between;align-items:center;min-height:26px}
.gl div{display:flex;justify-content:space-between;align-items:baseline;line-height:1.55;font-size:13px}.gl div.on{color:var(--acc);font-weight:600}
.gl small{margin-left:5px;color:var(--mute);font-size:11px}
.ib{display:flex;gap:4px}.ib button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}.ib svg{width:18px;height:18px}
.tbl{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-around}
.mid{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;justify-items:center;width:100%}
#game.bridge .mid{grid-template-columns:minmax(76px,96px) minmax(0,1fr) minmax(76px,96px)}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px}
.seat small{font-size:11px;color:var(--mute);font-weight:500}.seat small.on{color:var(--acc)}
.seatinfo{display:flex;justify-content:center;align-items:center;gap:3px;flex-wrap:wrap;max-width:100%}
.seatbadge{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-height:16px;padding:2px 5px;border:1px solid rgba(255,255,255,.14);border-radius:99px;background:rgba(255,255,255,.08);font-size:9px;line-height:1.15;color:var(--mute);white-space:nowrap}
.seatbadge i{font-style:normal;font-weight:600}
.seatbadge b{font-weight:700;color:var(--ink)}
.seatbadge.bid{border-color:rgba(255,207,74,.5);background:rgba(255,207,74,.14)}
.seatbadge.bid b{color:var(--acc)}
.seatbadge.partner{border-style:dashed}
.seatbadge.bidder{background:var(--acc);border-color:var(--acc)}
.seatbadge.bidder i,.seatbadge.bidder b{color:#000}
.seatbadge.passed{color:var(--mute)}
.seatbadge.think,.seatbadge.current{color:var(--acc);border-color:var(--acc)}
.seatbadge.current{animation:bidPulse .8s ease-in-out 2 alternate}
.seatbadge.fresh{animation:bidPop .4s ease}
.seatbadge.tricks{background:transparent}
@keyframes bidPulse{to{background:rgba(255,207,74,.18)}}
@keyframes bidPop{from{transform:scale(.84)}to{transform:scale(1)}}
.gl div.pulse b{display:inline-block;animation:scorePop .45s ease}
@keyframes scorePop{from{transform:translateY(3px);opacity:.35}to{transform:none;opacity:1}}
#me{flex-wrap:wrap;gap:4px 8px}
#me .seatbadge{font-size:10px}
#msg.badge-msg{color:var(--acc);font-weight:500}
#trumpdock{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:16px;background:var(--glass);border:1px solid var(--gb);box-shadow:var(--hi)}
#trumpdock b{display:block;font-size:10px;letter-spacing:.08em}
#trumpdock small{display:block;color:var(--mute);font-size:11px;letter-spacing:0;font-weight:500}
#trumpdock .trump-pip{width:32px;height:46px;flex:none;border-radius:6px;display:grid;place-items:center;background:#fff;color:#1b1b24;font-size:24px;border:1px solid rgba(0,0,0,.12)}
#trumpdock .trump-pip.r{color:var(--red)}
#trumpdock .backcard{width:32px;height:46px;flex:none;border-radius:6px;border:1px solid #dcdce2;background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 3px,transparent 3px 6px),#1b1b22}
#trumpdock .cd{--w:32px;flex:none}
#trumpdock .card{--w:32px;--h:46px}
#trumpdock.revealed{animation:trump-in .45s ease}
@keyframes trump-in{from{transform:rotateY(75deg);opacity:.35}to{transform:none;opacity:1}}
#passnotice{width:min(360px,100%);margin:0 auto 4px;padding:8px 10px;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:rgba(22,22,28,.94);text-align:center}
#passnotice .pass-title{font-size:14px;color:var(--ink);line-height:1.3;font-weight:600}
#passnotice .pass-sub{margin-top:2px;font-size:12px;color:var(--mute);line-height:1.35}
#passnotice .pass-row{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:2px 0}
#passnotice .pass-row label{font-size:13px;color:var(--ink);font-weight:600}
#passnotice .pass-cards{display:flex;justify-content:center;min-width:0;min-height:72px;align-items:center}
#passnotice .cd{--w:min(52px,14vw);flex:none;margin-left:6px;box-shadow:0 4px 12px #0008}
#passnotice .cd:first-child{margin-left:0}
#passnotice.stage-incoming .pass-cards.incoming .cd{animation:pass-in 1.6s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--i)*.16s)}
#passnotice.stage-sending .pass-cards.outgoing .cd{animation:pass-out 1.05s cubic-bezier(.4,0,.7,.35) both;animation-delay:calc(var(--i)*.1s)}
#passnotice.from-west.stage-incoming .pass-cards.incoming .cd{--dx:-46vw;--dy:-18vh}
#passnotice.from-east.stage-incoming .pass-cards.incoming .cd{--dx:46vw;--dy:-18vh}
#passnotice.from-north.stage-incoming .pass-cards.incoming .cd{--dx:0px;--dy:-36vh}
#passnotice.to-west.stage-sending .pass-cards.outgoing .cd{--dx:-42vw;--dy:-22vh}
#passnotice.to-east.stage-sending .pass-cards.outgoing .cd{--dx:42vw;--dy:-22vh}
#passnotice.to-north.stage-sending .pass-cards.outgoing .cd{--dx:0px;--dy:-34vh}
@keyframes pass-in{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.78)}22%{opacity:1}100%{opacity:1;transform:translate(0,0) scale(1)}}
@keyframes pass-out{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:.15;transform:translate(var(--dx),var(--dy)) scale(.8)}}
.incomingHand{filter:drop-shadow(0 0 5px rgba(255,207,74,.65));animation:incoming-glow 4.5s ease-out both}
@keyframes incoming-glow{0%,30%{filter:drop-shadow(0 0 6px rgba(255,207,74,.8))}100%{filter:none}}
.av{width:38px;height:38px;border-radius:12px;overflow:hidden;border:2px solid transparent;display:block}.av.on{border-color:var(--acc)}.av.sm{width:28px;height:28px;border-radius:9px}
.fs{display:flex}.fs.v{flex-direction:column}
.bk{display:block;border-radius:6px;border:2px solid #dcdce2;background:repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 3px,transparent 3px 6px),#1b1b22}
.fs.h .bk{width:26px;height:38px;margin-left:-15px}.fs.h .bk:first-child{margin-left:0}
.fs.v .bk{width:38px;height:26px;margin-top:-15px}.fs.v .bk:first-child{margin-top:0}
#msg{text-align:center;font-size:13px;color:var(--mute);min-height:18px;padding:0 8px}
#me{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--mute);min-height:36px;flex:0 0 auto}
#actionbar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 10px;min-height:42px;padding:2px 0 6px;font-size:12px;color:var(--mute);flex:0 0 auto}
#actionbar button{min-height:40px;padding:8px 16px;border-radius:99px;background:var(--acc);color:#000;font-size:13px;font-weight:600}
#actionbar button:disabled{opacity:.38}
.pass-count{font-weight:700;color:var(--ink)}
.pass-count.ready{color:var(--acc)}
/* trick */
#tr{display:grid;grid:repeat(3,auto)/repeat(3,auto);gap:4px;place-items:center;transition:transform .3s,opacity .3s}
#tr .cd{--w:min(54px,8vh)}
.tc{animation-duration:.3s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.tc.pos2{grid-area:1/2;animation-name:f2}.tc.pos1{grid-area:2/1;animation-name:f1}.tc.pos3{grid-area:2/3;animation-name:f3}.tc.pos0{grid-area:3/2;animation-name:f0}
@keyframes f0{from{opacity:0;transform:translateY(90px) scale(.85)}}@keyframes f1{from{opacity:0;transform:translateX(-90px) scale(.85)}}@keyframes f2{from{opacity:0;transform:translateY(-90px) scale(.85)}}@keyframes f3{from{opacity:0;transform:translateX(90px) scale(.85)}}
#tr.sw0{transform:translateY(190px);opacity:0}#tr.sw1{transform:translateX(-170px);opacity:0}#tr.sw2{transform:translateY(-190px);opacity:0}#tr.sw3{transform:translateX(170px);opacity:0}
@media(max-height:900px){#tr .cd{--w:min(54px,calc((100vh - 445px)/6.35))}#tr .cd{--w:min(54px,calc((100dvh - 445px)/6.35))}}
@media(min-width:400px) and (max-height:900px){#tr .cd{--w:min(54px,calc((100vh - 577px)/6.35))}#tr .cd{--w:min(54px,calc((100dvh - 577px)/6.35))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
@media(max-width:360px){.seatbadge{font-size:8px;padding:2px 4px}.seatinfo{gap:2px}}
/* cards */
.cd{--w:62px;display:block;position:relative;width:var(--w);height:calc(var(--w)*1.45);border-radius:calc(var(--w)*.14);background:#fff;color:#1b1b24;border:1px solid rgba(0,0,0,.12);font-size:calc(var(--w)*.3);line-height:1;padding:0;text-align:left}
.cd.r{color:var(--red)}
.ix{position:absolute;left:8%;top:5%;text-align:center;line-height:.95}
.ix b{display:block;font-size:1.35em;font-weight:700;letter-spacing:-.06em}.ix i{display:block;font-style:normal;font-size:1.1em}
.pp{position:absolute;left:66%;top:70%;transform:translate(-50%,-50%);font-style:normal;font-size:calc(var(--w)*.6);line-height:1}
.card{width:var(--w);height:var(--h,calc(var(--w)*1.45));margin-left:calc(var(--w)*-.3);perspective:600px;flex:none;transition:transform .35s var(--ease),opacity .3s}
.card:first-child{margin-left:0}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .4s var(--ease)}
.face,.back{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid rgba(0,0,0,.25)}
.face{background:#fafafa;color:#111;padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;font-weight:700;font-size:calc(var(--w)*.27)}
.face.red{color:#c0182d}.face b{align-self:center;font-size:calc(var(--w)*.55);line-height:1}
.back{background:repeating-linear-gradient(45deg,#2a4f9b,#2a4f9b 5px,#3a63b8 5px,#3a63b8 10px);transform:rotateY(0)}
.face{transform:rotateY(180deg)}
.card.facedown .inner{transform:rotateY(0)}
.card.faceup .inner{transform:rotateY(180deg)}
.card.dealin{animation:dealin .3s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
@keyframes dealin{from{opacity:0;transform:translateY(-140px) scale(.8)}to{opacity:1;transform:none}}
.card.lift{transform:translateY(-92px) scale(1.15);z-index:5}
.card.aside{transform:translate(calc(var(--w)*-1.1),-70px) scale(.95);z-index:4}
.card.glow .face{box-shadow:0 0 0 3px #facc15,0 0 22px rgba(250,204,21,.8)}
#hd{--hw:min(80px,calc((100vw - 20px)/5.3),11vh);display:flex;flex-direction:column;align-items:center;margin-top:auto;flex:0 0 auto;padding:0 4px max(10px,env(safe-area-inset-bottom,0px))}
.rw{display:flex;justify-content:center;padding-top:12px}.rw+.rw{margin-top:calc(var(--hw)*-.5);padding-top:0}
#hd .cd{--w:var(--hw);margin-left:calc(var(--hw)*-.3);transition:transform .18s ease,filter .18s}#hd .rw .cd:first-child{margin-left:0}
#hd .cd.ok{transform:translateY(-8px);border:2px solid var(--acc)}
#hd .cd.sel{transform:translateY(-12px);border:2px solid var(--acc);box-shadow:0 0 0 3px rgba(255,207,74,.45)}
#hd .cd.sel::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
#hd .cd.incoming{border:2px solid var(--acc);box-shadow:0 0 0 2px rgba(255,207,74,.35)}
#hd .cd .from{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);background:var(--acc);color:#000;font-style:normal;font-size:8px;font-weight:700;line-height:1.2;padding:1px 4px;border-radius:99px;pointer-events:none;white-space:nowrap}
#hd .cd.x{filter:brightness(.65) saturate(.5)}
/* popups */
#ov{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.42)}
.sheet{width:min(440px,100%);max-height:90vh;max-height:90dvh;overflow:auto;border-radius:20px;padding:14px;background:rgba(18,18,24,.96)}
.sheet p{margin:0 0 10px;font-size:13.5px;color:var(--mute);line-height:1.45}
.bt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:stretch}
.gbtn{min-height:44px;padding:12px 18px;line-height:1.25;white-space:normal;overflow-wrap:anywhere;text-align:center;box-sizing:border-box;font-weight:600;font-size:14px;color:#fff;flex:1 1 auto;min-width:132px;border-radius:16px;border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.28);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05)),rgba(20,22,30,.55);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);transition:transform .12s ease,filter .12s ease}
.gbtn b{display:block;font-size:15px;font-weight:700;color:#fff}
.gbtn small{display:block;font-size:12px;font-weight:500;color:#d7d7e2;margin-top:3px}
.gbtn.primary{background:var(--acc);color:#000;border-color:rgba(255,207,74,.95)}
.gbtn.primary b,.gbtn.primary small{color:#000}
.gbtn:active{transform:scale(.97);filter:brightness(1.2)}
.gbtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.gbtn:disabled{opacity:.45;pointer-events:none}
.bt button:has(.cd){background:none;padding:0;border-radius:14px;min-width:0;box-shadow:none}
.bt button:has(.cd) .cd{--w:min(62px,16vw)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.gbtn{background:rgba(20,22,30,.92)}}
@media(max-width:360px){.gbtn{min-width:0;flex:1 1 45%}}
#intro{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.82);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  display:flex;

  overflow:auto;
  background:#121216;
  border:1px solid rgba(255,255,255,.16);
  border-radius:24px;
  padding:22px 20px;
  box-sizing:border-box;
}
#intro .intro-box h2{
  margin:0 0 12px;
  font-size:22px;
  color:#f4f4f7;
}
#intro .intro-box p{
  margin:10px 0;
  color:#9a9aa8;
  line-height:1.45;
  font-size:14px;
}

  color:#ffcf4a;
  margin-right:8px;
}
#intro .intro-box .intro-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:16px;
  font-size:13px;
  color:#9a9aa8;
}
#intro .intro-box .intro-start{
  display:block;
  width:100%;
  margin-top:16px;
  background:#ffcf4a;
  color:#000;
  border:0;

 front=['<path d="M11 15.5c0-6 4-8.5 9-8.5s9 2.5 9 8.5z" fill="'+h+'"/><rect x="9.5" y="14.5" width="21" height="2.4" rx="1.2" fill="'+h+'"/>','<path d="M11.5 17c0-6 3.5-9 8.5-9s8.5 3 8.5 9c-2-3-5-4.5-8.5-4.5S13.5 14 11.5 17z" fill="'+h+'"/>','<path d="M11.5 16c0-6 3-8.5 8.5-8.5s8.5 2.5 8.5 8.5c-2-2.5-5-3.5-8.5-3.5S13.5 13.5 11.5 16z" fill="'+h+'"/><g fill="none" stroke="#222" stroke-width="1"><circle cx="16.5" cy="18.5" r="3"/><circle cx="23.5" cy="18.5" r="3"/><path d="M19.5 18.5h1"/></g>','<path d="M11.5 16c0-6 3.5-8.5 8.5-8.5s8.5 2.5 8.5 8.5c-2-3-5-4-8.5-4s-6.5 1-8.5 4z" fill="'+h+'"/>'][i];
 return '<svg viewBox="0 0 40 40" width="100%" height="100%"><rect width="40" height="40" fill="'+c.bg+'"/>'+back+'<path d="M5 40c1-8 7-11 15-11s14 3 15 11z" fill="'+c.sh+'"/><rect x="17.5" y="24" width="5" height="6" fill="'+c.sk+'"/><circle cx="11.8" cy="18.5" r="1.8" fill="'+c.sk+'"/><circle cx="28.2" cy="18.5" r="1.8" fill="'+c.sk+'"/><circle cx="20" cy="18" r="8.5" fill="'+c.sk+'"/>'+front+'<ellipse cx="16.5" cy="18.5" rx="1.5" ry="1.8" fill="#fff"/><ellipse cx="23.5" cy="18.5" rx="1.5" ry="1.8" fill="#fff"/><circle cx="16.8" cy="18.7" r=".9" fill="#222"/><circle cx="23.8" cy="18.7" r=".9" fill="#222"/><circle cx="14" cy="22" r="1.5" fill="#ff8a8a" opacity=".35"/><circle cx="26" cy="22" r="1.5" fill="#ff8a8a" opacity=".35"/><path d="M17.5 22.5q2.5 2 5 0" stroke="#3a2a2a" fill="none" stroke-width="1" stroke-linecap="round"/></svg>'}
function menu(){if(!$('#ov').hidden)return;ask('Game',[['Restart hand',restart],['New game',newGame],['Close',hideAsk]])}
const RU={bridge:['Each seat bids once, from 1 to 13 tricks.','Follow suit. If void, play a spade; overtrump when possible. Spades are always trump.','Make your bid to score it, miss it and lose it. Best total after 5 rounds wins.'],hearts:['Avoid every heart (1 point each) and the Q♠ (13 points).','Before play, pass three cards left, right, across, then hold every fourth hand. Follow suit; hearts cannot lead until broken.','The game ends at 50 points. The lowest score wins.']},TT={bridge:'Call Bridge',hearts:'Hearts'},SKIP={};
function intro(g,go){
  if(SKIP[g])return go();
  const prev=document.getElementById('intro');
  if(prev)prev.remove();
  const d=document.createElement('div');
  d.id='intro';
  d.setAttribute('style',
    'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.85);'+
    'display:flex;align-items:center;justify-content:center;padding:20px 16px;box-sizing:border-box;'
  );
  d.innerHTML=
    '<div style="width:min(340px,100%);max-height:90vh;overflow:auto;background:#121216;'+
    'border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:22px 20px;box-sizing:border-box;">'+
      '<h2 style="margin:0 0 12px;font-size:22px;color:#f4f4f7;">'+TT[g]+'</h2>'+
      RU[g].map((x,i)=>
        '<p style="margin:10px 0;color:#9a9aa8;line-height:1.45;font-size:14px;">'+
        '<b style="color:#ffcf4a;margin-right:8px;">'+(i+1)+'</b>'+x+'</p>'
      ).join('')+
      '<label style="display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13px;color:#9a9aa8;">'+
        '<input type="checkbox" id="sk"> Don’t show this again</label>'+
      '<button type="button" id="gg" style="display:block;width:100%;margin-top:16px;background:#ffcf4a;'+
        'color:#000;border:0;border-radius:99px;padding:12px;font-weight:600;font-size:15px;cursor:pointer;">'+
        'Start</button>'+
    '</div>';
  document.body.appendChild(d);
  d.querySelector('#gg').onclick=function(){
    if(d.querySelector('#sk').checked)SKIP[g]=1;
    d.remove();
    sfx('pop');
    go();
  };
}
const IC={on:'<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',off:'<path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/>',re:'<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>'},ico=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
function tgS(){SND=!SND;draw()}
function bidStatus(g,p){
 if(g.g==='bridge'){
  const bid=g.bid[p];
  if(Number.isInteger(bid))return{num:String(bid),kind:'bid',caption:p===0?'You':'Bid'};
 }
 if(g.phase==='bidding'&&g.turn===p)return{label:p===0?'Your bid':'Thinking…',kind:'think'};
 if(g.phase==='bidding')return{label:'Waiting',kind:'waiting'};
 return{label:'Waiting',kind:'waiting'}
}
function seatInfoHTML(g,p){
 if(g.g!=='bridge')return'';
 const bid=bidStatus(g,p),current=bid.kind==='think',fresh=g.freshBid===p?' fresh':'';
 const badge=bid.num!=null
  ?'<span class="seatbadge '+bid.kind+(bid.partner?' partner':'')+(bid.bidder?' bidder':'')+(current?' current':'')+fresh+'" aria-label="'+NM[p]+' bid '+bid.num+'"><i>'+bid.caption+'</i><b>'+bid.num+'</b></span>'
  :'<span class="seatbadge '+bid.kind+(bid.partner?' partner':'')+(current?' current':'')+'" aria-label="'+NM[p]+' '+bid.label+'">'+bid.label+'</span>';
 const tricks=g.g==='bridge'&&g.phase!=='bidding'?'<span class="seatbadge tricks" aria-label="'+NM[p]+' '+g.tw[p]+' tricks taken"><i>Tricks</i><b>'+g.tw[p]+'</b></span>':'';
 return'<div class="seatinfo">'+badge+tricks+'</div>'
}
const SUIT_NAME=['Spades','Hearts','Diamonds','Clubs'];
function trumpHTML(g){
 if(g.g==='bridge')return'<div class="trump-pip" aria-hidden="true">♠</div><div><small>Trump · Spades</small></div>';
 return'';
}
function passNoticeHTML(g){
 const notice=g.passNotice;if(!notice)return'';
 if(notice.kind==='hold')return'<div class="pass-title"><b>'+(notice.round?'Round '+notice.round+': ':'')+'Hold — no cards exchanged</b></div>';
 if(notice.kind==='choose'){const direction=notice.direction||g.passDir,round=notice.round||g.rd,to=NM[heartsPassReceiver(0,direction)];return'<div class="pass-title"><b>'+heartsPassBanner(round)+'</b></div><div class="pass-sub">Select exactly 3 cards to pass to '+to+'.</div>'}
 const from=notice.source,to=notice.receiver;
 const cards=list=>list.map((c,i)=>'<span class="cd '+(RED(c.s)?'r':'')+'" style="--i:'+i+'" aria-label="'+rl(c.r)+' of '+SU[c.s]+'">'+face(c)+'</span>').join('');
 if(notice.stage==='sending')return'<div class="pass-row"><label>Sending 3 cards to '+NM[to]+'</label><div class="pass-cards outgoing" data-to="'+NM[to]+'">'+cards(notice.outgoing)+'</div></div>';
 return'<div class="pass-row"><label>Received 3 cards from '+NM[from]+'</label><div class="pass-sub">These cards stay marked in your hand.</div><div class="pass-cards incoming" data-from="'+NM[from]+'">'+cards(notice.incoming)+'</div></div>'
}
function board(g){
 const f=v=>+v.toFixed(1),R=(a,b,c,on,pulse)=>'<div class="'+(on?'on ':'')+(pulse?'pulse':'')+'"><span>'+a+'</span><span><b>'+b+'</b>'+(c?'<small>'+c+'</small>':'')+'</span></div>';
 const phaseLabel=g.phase==='bidding'?'Bidding':g.phase==='passing'?'Passing':g.phase==='receiving'?'Receiving':g.phase==='hold'?'Hold':g.phase==='round-end'?'Hand complete':'Play';
 const i1=g.g=='bridge'?R('Round',Math.min(g.rd,5)+'/5')+R('Phase',phaseLabel):R('Hand',g.rd)+R('Hearts',g.br?'broken':'not yet');
 const s1=NM.map((x,i)=>R(x,f(g.sc[i]),g.g=='hearts'&&g.pp[i]?'+'+g.pp[i]+' pts':'',g.turn==i,g.scorePulse===i)).join('');
 $('#info').innerHTML='<h4>Info<span class="ib"><button aria-label="Sound" onclick="tgS()">'+ico(SND?IC.on:IC.off)+'</button><button aria-label="Restart or new game" onclick="menu()">'+ico(IC.re)+'</button></span></h4>'+i1;
 $('#sc').innerHTML='<h4>Scores</h4>'+s1;
 const trump=trumpHTML(g),dock=$('#trumpdock');
 if(dock._html!==trump){dock.innerHTML=trump;dock._html=trump}
 dock.hidden=!trump;dock.className=g.g==='bridge'?'revealed':'';
 dock.setAttribute('aria-label',g.g==='bridge'?'Trump is spades':'');
 [1,2,3].forEach(p=>{$('#s'+p).innerHTML='<div class="av'+(g.turn==p?' on':'')+'">'+AVS(p)+'</div><small class="'+(g.turn==p?'on':'')+'">'+NM[p]+'</small>'+seatInfoHTML(g,p)+'<div class="fs '+(p==2?'h':'v')+'">'+Array.from({length:g.h[p].length},(_,x)=>'<i class="bk" style="--i:'+x+'"></i>').join('')+'</div>'});
 const h=g.h[0],my=g.phase==='play'&&g.turn==0&&g.tr.length<4,L=my?legal(0):[],received=g.incomingNotice||[],fromName=Number.isInteger(g.passNotice?.source)?NM[g.passNotice.source]:'';
 const hdEl=$('#hd');let fit=h.length;
 if(typeof getComputedStyle==='function'&&hdEl&&hdEl.clientWidth>0){const hwPx=parseFloat(getComputedStyle(hdEl).getPropertyValue('--hw'))||46,step=hwPx*.7;fit=hwPx>0&&step>0?1+Math.max(0,Math.floor((hdEl.clientWidth-8-hwPx)/step)):h.length}
 const m=h.length>fit?Math.ceil(h.length/2):h.length;
 const b=h.map((c,i)=>{const selected=g.phase==='passing'&&g.passSelected.includes(c),mark=received.includes(c);return'<button style="--i:'+i+'" class="cd '+(RED(c.s)?'r ':'')+(selected?'sel ':mark?'incoming ':my?(L.includes(c)?'ok':'x'):'')+'" onclick="tap('+i+')" aria-label="'+rl(c.r)+' of '+SU[c.s]+(selected?', selected to pass':'')+(mark?', received from '+fromName:'')+'">'+face(c)+(mark?'<em class="from">'+fromName+'</em>':'')+'</button>'});
 const hdHTML='<div class="rw">'+b.slice(0,m).join('')+'</div>'+(b.length>m?'<div class="rw">'+b.slice(m).join('')+'</div>':'');
 if($('#hd')._html!==hdHTML){$('#hd').innerHTML=hdHTML;$('#hd')._html=hdHTML}
 $('#hd').className=g.incomingHighlight?'incomingHand ':'';
 const status=g.phase==='passing'?heartsPassBanner(g.rd):g.phase==='receiving'?'Received 3 cards from '+fromName:g.phase==='hold'?'Hold — no cards exchanged':g.phase==='bidding'?(g.turn===0?'Your bid':g.turn>0?NM[g.turn]+' bidding':'Waiting for bids'):g.phase==='round-end'?'Hand complete':g.turn===0?'Your turn':g.turn>0?NM[g.turn]+' to play':'Waiting';
 $('#me').innerHTML='<span class="av sm'+(g.turn==0?' on':'')+'">'+AVS(0)+'</span><span>South · '+status+'</span>'+seatInfoHTML(g,0);  const action=$('#actionbar');
 $('#game').className=g.g+(g.phase==='passing'?' passing':'');
 if(g.phase==='passing'){
  const ready=g.passSelected.length===3;
  action.innerHTML='<span>Pass '+passDirectionLabel(g.passDir)+' · <b class="pass-count'+(ready?' ready':'')+'">'+g.passSelected.length+'/3 selected</b></span><button onclick="commitHeartsPass()" '+(ready?'':'disabled')+'>Confirm pass</button>';
  action.hidden=false
 }else{action.hidden=true;action.innerHTML=''}
 const notice=$('#passnotice');
 g.animSet=null;
 if(notice._renderedPassNotice!==g.passNotice){
  const seat=['south','west','north','east'];   notice.className=g.passNotice?.kind==='transfer'?'from-'+seat[g.passNotice.source]+' to-'+seat[g.passNotice.receiver]+' stage-'+g.passNotice.stage:g.passNotice?'stage-'+g.passNotice.kind:'';
  notice.innerHTML=passNoticeHTML(g);notice.hidden=!g.passNotice;notice._renderedPassNotice=g.passNotice
 }
}
function draw(){
 const g=G;if(!g)return;if(g.g=='bridge')$('#gt').textContent='Call Bridge · Round '+Math.min(g.rd,5)+' of 5';
 if(g.g==='hearts'){
  if(g.phase==='passing'||g.phase==='receiving'||g.phase==='hold'){
   if(g.tr&&g.tr.length)g.tr=[];
   $('#tr').innerHTML='';g.k='';
   board(g);
   return;
  }
 }
 const k=g.tr.map(x=>x.p+'.'+x.c.s+'.'+x.c.r).join();
 if(k!==g.k){g.k=k;$('#tr').innerHTML=g.tr.map(x=>'<div class="tc pos'+x.p+'"><div class="cd '+(RED(x.c.s)?'r':'')+'">'+face(x.c)+'</div></div>').join('')}
 board(g)}
</script></body></html>
